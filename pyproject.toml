[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "signoff-camera"
version = "0.2.0rc1"
description = "Camera-based robot task measurement and inspectable evidence"
requires-python = ">=3.12,<3.14"
license = "MIT"
readme = "README.md"
dependencies = [
  "fastapi==0.143.0",
  "starlette==1.7.0",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "pyyaml==6.0.3",
  "av==19.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*", "robotics*", "tools*"]

[tool.setuptools.package-data]
"apps.api" = ["templates/*.html"]
