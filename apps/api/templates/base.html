<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Signoff{% endblock %}</title><style>
:root{font-family:system-ui;color:#1c2632;background:#f4f6f8}body{max-width:1080px;margin:2rem auto;padding:0 1rem}nav{display:flex;gap:1.3rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid #ccd4de}a{color:#1551a0}h1{font-size:1.8rem}.card,form{background:white;border:1px solid #d8dfe8;border-radius:8px;padding:1.1rem;margin:1rem 0}label{display:block;margin:.6rem 0}input,select,textarea,button{font:inherit;padding:.45rem;border:1px solid #a8b4c3;border-radius:4px}textarea{width:95%;min-height:12rem}button{background:#164d8d;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}th,td{padding:.6rem;text-align:left;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow:auto}small,.muted{color:#586b80}.warn{color:#985f00}video,img.preview{max-width:100%;border-radius:5px}#notice{white-space:pre-wrap}button:focus,a:focus{outline:3px solid #efb556}
</style></head><body>{{ nav | safe }}<main>{% block content %}{% endblock %}</main><p id="notice" role="status" aria-live="polite"></p>
<script>
function csrf(){return (document.cookie.split('; ').find(x=>x.startsWith('signoff_csrf='))||'=').split('=').slice(1).join('=')}
async function api(url,body,method='POST'){const h={'X-CSRF-Token':csrf()};if(!(body instanceof FormData))h['Content-Type']='application/json';const r=await fetch(url,{method,headers:h,body:body instanceof FormData?body:JSON.stringify(body)});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{d={detail:raw}} if(!r.ok)throw Error(d.detail||r.statusText);return d}
function notice(value){document.getElementById('notice').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)}
document.querySelectorAll('form[data-api]').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();try{const d=await api(form.action,new FormData(form));if(d.redirect)location.assign(d.redirect);else notice(d)}catch(e){notice(e.message)}}));
</script>{% block scripts %}{% endblock %}</body></html>
