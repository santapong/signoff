<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Signoff{% endblock %}</title><link rel="stylesheet" href="/static/workbench.css"></head><body>
<div class="app-shell"><aside class="rail"><a href="/ui/" class="brand" aria-label="Signoff sessions"><svg viewBox="0 0 18 24" aria-hidden="true"><path d="M2 21v-6M7 21V9M12 21V3" stroke="currentColor" stroke-width="2.5"/></svg>SIGNOFF</a><nav aria-label="Main navigation">
<a href="/ui/profiles" {% if section=='stations' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20h12M8 17h8M9 12l-2 5M15 12l2 5M7 4h10M9 4v4a3 3 0 006 0V4M6 21v-2h12v2"/></svg><span>Stations</span></a>
<a href="/live/" {% if section=='capture' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h4l2-3h6l2 3h4v15H3z"/><circle cx="12" cy="13" r="4"/></svg><span>Capture</span></a>
<a href="/ui/" {% if section=='sessions' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="4"/><path d="M9 7l7 5-7 5z"/></svg><span>Sessions</span></a>
<a href="/ui/qualification" {% if section=='qualification' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12l3 3 7-7"/></svg><span>Qualification</span></a>
</nav><div class="rail-foot">Camera measurement<br><span>Local operator workspace</span></div></aside><main class="main">{% block content %}{% endblock %}<div id="notice" class="notice" role="status" aria-live="polite"></div>{% block after_notice %}{% endblock %}</main></div>
<script src="/static/app.js" defer></script>{% block scripts %}{% endblock %}</body></html>
