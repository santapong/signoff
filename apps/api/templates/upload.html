{% extends 'base.html' %}{% block title %}Signoff — Upload{% endblock %}{% block content %}<h1>Upload session video</h1>
<form action="/ui/upload" method="post" enctype="multipart/form-data" data-api>
<label>Recorded video <input type="file" name="video" accept="video/mp4,video/x-matroska,.mkv" required></label>
<label>Station profile <select name="profile_id"><option value="">Motion baseline — unqualified</option>{% for p in profiles %}<option value="{{ p.profile_id }}">{{ p.get('station_id',p.profile_id) }} — {{ p.profile_id }}</option>{% endfor %}</select></label>
<label>Notes <input type="text" name="notes"></label><button>Upload &amp; open session</button></form>
<p class="muted">MP4 and MKV are decoded and checked. Profile revisions are frozen with the upload. Reference labels are stored separately.</p>{% endblock %}
