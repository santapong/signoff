{% extends 'base.html' %}{% block title %}Signoff — Live Monitoring{% endblock %}{% block content %}<h1>Live Monitoring</h1>
<form id="start-live"><label>Station profile<select name="profile_id" required>{% for p in profiles %}<option value="{{ p.profile_id }}">{{ p.profile_id }} (latest revision {{ p.revision }})</option>{% endfor %}</select></label>
<label>Source<select name="source"><option value="usb">USB camera — operator-selected device</option>{% if allow_synthetic %}<option value="synthetic">Synthetic development input — unqualified</option>{% endif %}</select></label>
<label>USB device index<input name="device_index" type="number" min="0" max="255" value="0"></label><button>Start selected capture</button> <button id="stop-live" type="button">Stop &amp; preserve recording</button></form>
<div class="card"><p>Source: <b id="source">No active source</b> · Recording: <b id="recording">stopped</b></p><p>Completed cycles: <b id="cycles">N/A</b> · Camera: <b id="camera">N/A</b> · Coverage: <b id="coverage">N/A</b></p><p id="session-link"></p><pre id="quality"></pre><img class="preview" id="preview" alt="Most recent captured frame" hidden></div><div class="card"><h2>Events</h2><pre id="events"></pre></div>{% endblock %}
{% block scripts %}<script>
let liveId=null;async function refresh(){try{const s=await (await fetch('/live/status')).json();document.getElementById('source').textContent=s.source||'No active source';document.getElementById('recording').textContent=s.recording?.status||s.recording_state||(s.running?'recording':'stopped');document.getElementById('cycles').textContent=s.completed_cycles??'N/A';document.getElementById('camera').textContent=s.running?(s.camera_down?'LOST':'observing'):'stopped';document.getElementById('coverage').textContent=JSON.stringify(s.coverage??'N/A');document.getElementById('quality').textContent=JSON.stringify(s.quality_flags||[],null,2);document.getElementById('events').textContent=JSON.stringify(s.events||[],null,2);if(s.session_id){liveId=s.session_id;const a=document.createElement('a');a.href='/ui/sessions/'+s.session_id;a.textContent='Open persisted session '+s.session_id;document.getElementById('session-link').replaceChildren(a)}if(s.running){const im=document.getElementById('preview');im.src='/live/preview?t='+Date.now();im.hidden=false;im.onerror=()=>im.hidden=true}}catch(e){notice(e.message)}}
document.getElementById('start-live').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{notice(await api('/live/start',{profile_id:f.get('profile_id'),source:f.get('source'),device_index:Number(f.get('device_index')),record:true}));refresh()}catch(e){notice(e.message)}});document.getElementById('stop-live').onclick=async()=>{try{notice(await api('/live/stop',{}));refresh()}catch(e){notice(e.message)}};refresh();setInterval(refresh,1500);
</script>{% endblock %}
